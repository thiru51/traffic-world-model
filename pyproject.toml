[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twm"
version = "0.1.0"
description = "Compact DreamerV3-style latent world model for traffic-scene anticipation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "metadrive-simulator>=0.4.3",
    # MetaDrive 0.4.x is not numpy 2 clean, so this stays pinned below 2.
    "numpy>=1.26,<2",
    "gymnasium>=1.3",
    "opencv-python>=4.11",
    "shapely>=2.1",
    "scipy>=1.17",
    "pyyaml>=6.0",
    "matplotlib>=3.11",
    "imageio>=2.37",
    "tqdm>=4.70",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, pytest cannot import the package unless it has been installed.
pythonpath = ["src"]
