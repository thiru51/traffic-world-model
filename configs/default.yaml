# Defaults for a single consumer GPU. Developed and measured on an RTX 4080 Laptop 12GB,
# but nothing here assumes that card: batch_size 0 means "work it out from free VRAM at
# startup" and device "auto" means "cuda if there is one, else cpu".
# Every entry mirrors a field in src/twm/config.py.

model:
  size: s          # xs | s | m - see MODEL_SIZES in src/twm/utils/device.py
  cnn_depth: 24
  deter: 512
  stoch: 32
  classes: 32
  hidden: 384
  unimix: 0.01
  n_bins: 255
  kl_free: 1.0
  dyn_scale: 0.5
  rep_scale: 0.1

ac:
  hidden: 384
  horizon: 15
  gamma: 0.997
  lam: 0.95
  entropy_coef: 0.0003

env:
  resolution: 64
  frame_stack: 3
  map_size: 3
  traffic_density: 0.2
  num_scenarios: 60
  start_seed: 0

data:
  dir: data/metadrive64
  episodes: 120
  max_steps_per_episode: 250
  action_noise: 0.25
  seed: 0

train:
  steps: 3000
  batch_size: 0    # 0 = auto-scale from free VRAM; pass --batch-size N to pin it
  seq_len: 50
  lr: 0.0001
  ac_lr: 0.00003
  amp: true
  compile: false
  tf32: true
  cudnn_benchmark: true
  grad_checkpoint: false
  train_actor_critic: true
  log_every: 25
  ckpt_every: 500
  out_dir: checkpoints/run1
  device: auto
